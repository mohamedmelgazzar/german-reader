name: Make audio

on:
  push:
    branches: [main]
    paths: ["index.html", "scripts/**", ".github/workflows/audio.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: node scripts/extract.js
      - run: python scripts/make_audio.py
      - name: Save new clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "No new audio"; exit 0; fi
          git commit -m "Update audio clips"
          git pull --rebase
          git push
